<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #14171f;
    --line: rgba(255, 255, 255, 0.09);
    --text: #eef1f7;
    --dim: #8b93a4;
    --faint: #6b7280;
    --up: #ffa94d;
    --down: #4f8cff;
    --ok: #4ade80;
  }

  /* 明色主题：跟着主界面走 */
  body.light {
    --bg: #ffffff;
    --line: rgba(0, 0, 0, 0.08);
    --text: #1a1d23;
    --dim: #5f6b7a;
    --faint: #8b95a3;
    --up: #e8871a;
    --down: #2563eb;
    --ok: #16a34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-app-region: drag;
  }

  .card {
    position: relative; height: 100%; overflow: hidden;
    background: var(--bg);
    display: flex; flex-direction: column;
  }
  /* 顶部一条极淡的渐变，纯色背景上也能有层次 */
  .card::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 44px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), transparent);
  }
  body.light .card::before {
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.035), transparent);
    pointer-events: none;
  }

  .head {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 12px 6px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
    background: var(--ok); box-shadow: 0 0 8px rgba(74, 222, 128, 0.75);
  }
  .dot.on { animation: breathe 2.4s ease-in-out infinite; }
  .dot.off { background: #5b6473; box-shadow: none; animation: none; }
  body.light .dot { box-shadow: 0 0 6px rgba(22, 163, 74, 0.45); }
  body.light .dot.off { background: #c3c9d2; }
  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .55; transform: scale(.86); }
  }
  .mode { font-size: 11px; color: var(--text); font-weight: 600; }
  .port { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .close {
    -webkit-app-region: no-drag; cursor: pointer; color: var(--faint);
    font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 5px;
    transition: background .12s, color .12s;
  }
  .close:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

  .node {
    padding: 0 12px 8px; font-size: 10.5px; color: var(--dim); line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .split { height: 1px; margin: 0 12px; background: var(--line); }

  .speeds {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 9px 12px 2px;
  }
  .sp { flex: 1; min-width: 0; }
  .sp .k {
    display: flex; align-items: center; gap: 3px;
    font-size: 9.5px; color: var(--faint); margin-bottom: 1px;
  }
  .sp .v {
    font-size: 15px; font-weight: 650; letter-spacing: -.01em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .sp .v small { font-size: 9.5px; font-weight: 500; opacity: .65; margin-left: 2px; }
  .sp.up .v { color: var(--up); }
  .sp.down .v { color: var(--down); }

  .wave { display: block; width: 100%; height: 24px; margin-top: 2px; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 9px; font-size: 9.5px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .foot b { color: var(--dim); font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="dot off" id="dot"></span>
      <span class="mode" id="mode">未开启</span>
      <span class="port" id="port"></span>
      <span class="spacer"></span>
      <span class="close" id="close" title="关闭">×</span>
    </div>

    <div class="node" id="node">未开启代理</div>

    <div class="split"></div>

    <div class="speeds">
      <div class="sp up">
        <div class="k"><span>↑</span><span>上传</span></div>
        <div class="v" id="up">—</div>
      </div>
      <div class="sp down">
        <div class="k"><span>↓</span><span>下载</span></div>
        <div class="v" id="down">—</div>
      </div>
    </div>

    <svg class="wave" id="wave" preserveAspectRatio="none"></svg>

    <div class="foot">
      <span>累计</span>
      <span><b id="total">—</b></span>
    </div>
  </div>

<script>
  const $ = (s) => document.querySelector(s);

  function fmtSpeed(bps) {
    if (bps == null || !isFinite(bps)) return { v: '—', u: '' };
    const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
    let v = bps;
    let i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
    const num = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
    return { v: num, u: units[i] };
  }

  function fmtBytes(b) {
    if (b == null || !isFinite(b)) return '—';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let v = b;
    let i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
    return (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + ' ' + units[i];
  }

  /** 迷你波形：最近 40 次下载速度，折线 + 渐变填充 */
  function drawWave(list, on) {
    const svg = $('#wave');
    const W = 230;
    const H = 24;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    if (!on || !list || list.length < 2) {
      svg.innerHTML = '';
      return;
    }
    const max = Math.max.apply(null, list.concat([1]));
    const step = W / (list.length - 1);
    const pts = list.map((v, i) => {
      const x = i * step;
      const y = H - 2 - (Math.min(v, max) / max) * (H - 6);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });

    svg.innerHTML =
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#4f8cff" stop-opacity=".45"/>' +
      '<stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<polygon points="0,' + H + ' ' + pts.join(' ') + ' ' + W + ',' + H + '" fill="url(#g)"/>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#4f8cff" stroke-width="1.5" ' +
      'stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>';
  }

  window.trafficApi.onData((d) => {
    const on = !!d.running;
    $('#dot').classList.toggle('off', !on);
    $('#dot').classList.toggle('on', on);
    $('#mode').textContent = on ? (d.tunMode ? 'TUN 全局' : '系统代理') : '未开启';
    $('#port').textContent = on && d.port ? ':' + d.port : '';

    const line = on
      ? (d.nodeName ? d.nodeName + (d.routeLabel ? ' · ' + d.routeLabel : '') : d.routeLabel || '已开启')
      : '未开启代理';
    $('#node').textContent = line;
    $('#node').title = line;

    const u = fmtSpeed(d.up);
    const dn = fmtSpeed(d.down);
    $('#up').innerHTML = on ? u.v + (u.u ? '<small>' + u.u + '</small>' : '') : '—';
    $('#down').innerHTML = on ? dn.v + (dn.u ? '<small>' + dn.u + '</small>' : '') : '—';
    $('#total').textContent = on ? '↑' + fmtBytes(d.upTotal) + '   ↓' + fmtBytes(d.downTotal) : '—';

    drawWave(d.history, on);
  });

  // 跟随主界面的明暗主题
  if (window.trafficApi.onTheme) {
    window.trafficApi.onTheme((t) => document.body.classList.toggle('light', t === 'light'));
  }

  $('#close').addEventListener('click', () => window.trafficApi.close());
</script>
</body>
</html>
